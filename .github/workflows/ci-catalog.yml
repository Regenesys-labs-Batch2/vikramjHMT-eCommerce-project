name: ci-catalog

on:
  push:
    branches: [ main ]
    paths: [ 'catalog-service/**', '.github/workflows/service-ci.yml', '.github/workflows/ci-catalog.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'catalog-service/**', '.github/workflows/service-ci.yml', '.github/workflows/ci-catalog.yml' ]
  workflow_dispatch:

concurrency:
  group: ci-catalog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: catalog-service
