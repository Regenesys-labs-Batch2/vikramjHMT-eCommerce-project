name: ci-cart

on:
  push:
    branches: [ main ]
    paths: [ 'cart-service/**', '.github/workflows/service-ci.yml', '.github/workflows/ci-cart.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'cart-service/**', '.github/workflows/service-ci.yml', '.github/workflows/ci-cart.yml' ]
  workflow_dispatch:

concurrency:
  group: ci-cart-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: cart-service
