name: ci-inventory

on:
  push:
    branches: [ main ]
    paths: [ 'inventory-service/**', '.github/workflows/service-ci.yml', '.github/workflows/ci-inventory.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'inventory-service/**', '.github/workflows/service-ci.yml', '.github/workflows/ci-inventory.yml' ]
  workflow_dispatch:

concurrency:
  group: ci-inventory-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: inventory-service
