name: ci-order

on:
  push:
    branches: [ main ]
    paths: [ 'order-service/**', '.github/workflows/service-ci.yml', '.github/workflows/ci-order.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'order-service/**', '.github/workflows/service-ci.yml', '.github/workflows/ci-order.yml' ]
  workflow_dispatch:

concurrency:
  group: ci-order-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: order-service
