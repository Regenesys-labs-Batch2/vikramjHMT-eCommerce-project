name: ci-payment

on:
  push:
    branches: [ main ]
    paths: [ 'payment-service/**', '.github/workflows/service-ci.yml', '.github/workflows/ci-payment.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'payment-service/**', '.github/workflows/service-ci.yml', '.github/workflows/ci-payment.yml' ]
  workflow_dispatch:

concurrency:
  group: ci-payment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: payment-service
