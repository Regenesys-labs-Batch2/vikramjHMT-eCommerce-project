name: ci-identity

on:
  push:
    branches: [ main ]
    paths: [ 'identity-service/**', '.github/workflows/service-ci.yml', '.github/workflows/ci-identity.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'identity-service/**', '.github/workflows/service-ci.yml', '.github/workflows/ci-identity.yml' ]
  workflow_dispatch:

concurrency:
  group: ci-identity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: identity-service
